# Tier 2 gap register: checked against the PRIMARY TEXT, kept separate from the agent-found Tier 1
# candidates (organisers' guidance: keep agent output and the team's own analysis apart).
#
# status: verified            the primary texts in our KB show the gap
#         rejected            we found a provision that covers it (a useful result in itself)
#         needs_more_evidence the deciding text is not in our KB; we do not claim the gap
# Every quote is verbatim from kb/clauses/clauses.jsonl (checked by scripts/check_gaps_verified.py).
# Scope: "in our KB" means the 29 official documents with clauses in kb/sources/manifest.csv (3,095 clauses).
# The UAE PDPL, Data Office law, telecom law, medical liability law, Cabinet Resolution 32/2020, Ministerial
# Resolution 51/2021, ADHICS, the DHA AI policy and the cyber strategy were refused to automated retrieval and
# added by manual browser download (TG1). Arabic texts could not be extracted cleanly (all failed QA).
# Revision 2026-11-09 (after an adversarial check of every gap against the whole KB): TV1 rejected
# (DoH RAI 3.1.4.5.1 and ADHICS CM 4.2 cover it), TV9 rejected (ADHICS IM 2.2 names the regulator; the
# missing deadline is folded into TV2), TV2, TV5, TV7 and TV8 narrowed to what the texts support.
# These are domain-level observations from a simulated exercise: not legal advice, not a verdict on
# any UAE institution.
checked_by: "build lead (Claude), from primary text, 2026-11-09; re-checked 2026-11-10 incl. DHA sentinel-event standard"
team_signoff: "Abhra Dubey, 2026-11-10 (all nine rows reviewed against the quoted clauses)"

gaps:
  - id: TV1
    candidate: CG1
    type: policy
    pattern: G1_POLICY_VOID
    title: "Processing health data abroad during an outage (failover or disaster recovery)"
    status: rejected
    statement: >-
      Hypothesis rejected: the rule exists and it prohibits the move. The DoH Responsible AI Standard requires
      the compute and storage of AI systems, for both active and disaster-recovery sites, to be inside the UAE,
      and ADHICS requires healthcare entities to ensure health information is not transmitted outside the UAE.
      Federal Law 2/2019 allows health data abroad only in cases a Health Authority decision prescribes, and
      none of the ten cases in Ministerial Resolution 51/2021 is failover. Failover abroad is therefore not an
      unregulated situation but a prohibited one, and the gate's DENY at T2 rests on these clauses.
    uae_evidence:
      - clause_id: AE-DOH-RAI-2025/sec-3.1.4.5.1/en
        quote: "The compute and storage infrastructure of AI systems for both active and disaster recovery sites must be situated within the UAE."
      - clause_id: AE-DOH-ADHICS/sec-CM-4.2/en
        quote: "Ensure that healthcare information is not transmitted outside the UAE"
      - clause_id: AE-FL-2-2019/art-13/en
        quote: "may only be stored, processed, generated or transferred outside the State in the cases prescribed by virtue of a decision issued by the Health Authority in coordination with the Ministry"
      - clause_id: AE-MR-51-2021/art-2/para-1/en
        quote: "Health data and information may not be stored or transferred outside the country if it is related to health services provided inside the country"
    global_example: null
    readiness_dimensions: [10, 13]
    implication: >-
      The answer to failover abroad is a clear no, which is what the gate enforces; continuity has to come from an
      in-country disaster-recovery site or human fallback. An earlier draft of this register listed it as a gap
      although our own agents were citing DoH RAI 3.1.4.5.1; a reviewer caught it, and the gate rule now cites it.
    next_step: "None as a gap. For providers: the in-country disaster-recovery site is the continuity route the DoH standard expects."
  - id: TV2
    candidate: CG2
    type: policy
    pattern: G4_CLOCK
    title: "No reporting clock for an AI performance drift before harm is confirmed"
    status: verified
    scope_note: "Serious harm already has a clock: DHA's sentinel-event standard (outside our KB, checked by hand) requires notice within 48 hours and a preliminary report within 72 hours, and excludes near misses. The gap is the drift before harm. The PDPL's Executive Regulations are not in the KB."
    statement: >-
      Once a patient is seriously harmed, health-facility sentinel-event rules apply: in Dubai, notice to DHA
      within 48 hours and a preliminary report within 72 hours (DHA/HRS/CACD/ST-01 v1.1, 5.5), with near misses
      excluded (8.2.1). The T1 event in S1 is different: a measured AI drift (under-triage of Arabic-language
      chest-pain cases rising from 2% to 9%) before any harm is confirmed. For that, the AI-specific duties send
      incidents to the regulator but set no deadline: ADHICS requires significant or severe incidents to reach
      the health sector regulator of Abu Dhabi and asks only that serious incidents be communicated "promptly",
      the DHA AI policy requires end users to report AI incidents to DHA, and the DoH Responsible AI Standard
      assigns adverse-outcome reporting to governance bodies without a clock. Even the EU AI Act's clocks start
      only when an incident "leads to" serious harm (Art. 3(49)). No instrument we checked sets a reporting
      trigger and deadline for AI performance drift before harm.
    external_evidence:
      - source: "DHA Standards for Sentinel Events Notification and Management in Health Facilities, DHA/HRS/CACD/ST-01, v1.1, effective 06/05/2025"
        url: "https://www.dha.gov.ae/uploads/042025/Sentinel%20Events%20Notification%20And%20Management%20In%20Health%20Facilities-Final202541624.pdf"
        section: "5.5.1, 5.5.3, 8.2.1"
        quote: "Notify within 48 hours from the date of confirmation of SE"
        checked: "by hand, 2026-11-10 (not in the KB, so not checked by scripts/check_gaps_verified.py)"
    uae_evidence:
      - clause_id: AE-DOH-ADHICS/sec-IM-2.2/en
        quote: "Ensure that significant/severe impact incidents are reported to the health sector regulator of Abu Dhabi"
      - clause_id: AE-DOH-ADHICS/sec-SA-7.6/en
        quote: "promptly communicated to the appropriate authorities"
      - clause_id: AE-DHA-AI-POLICY/sec-4.8.1/en
        quote: "Report to DHA-HRS all known or suspected incidents or deficiencies related to AI"
      - clause_id: AE-DOH-RAI-2025/sec-3.1.7.1.2.3/en
        quote: "Reporting adverse outcomes or ethical concerns to governance bodies."
      - clause_id: AE-FDL-45-2021/art-9/para-1/en
        quote: "within the period and in accordance with the measures and requirements set by the Executive Regulations"
    global_example:
      jurisdiction: EU
      instrument: "AI Act, Art. 73(2)"
      clause_id: EU-REG-2024-1689/art-73/para-2/en
      quote: "not later than 15 days after the provider or, where applicable, the deployer, becomes aware of the serious incident"
      how_it_handles: "AI-specific clocks: 15 days by default, 2 days for widespread infringements (Art. 73(3)), 10 days in case of death (Art. 73(4)). They start only once an incident leads to serious harm (Art. 3(49)), so pre-harm drift is open in the EU too."
    readiness_dimensions: [10, 7]
    implication: >-
      At T1 the drift was visible to the triage service and the health regulator, but no rule told anyone to
      report it by a deadline, so each institution set its own timing. The early signal that could prevent a
      sentinel event is the one with no clock.
    next_step: "Define a reporting trigger and clock for AI performance drift before harm (for example a threshold on a monitored subgroup metric) in the DoH Responsible AI Standard's risk protocol, and propose the trigger as a standards item for ITU-T."
  - id: TV3
    candidate: CG5
    type: policy
    pattern: G1_POLICY_VOID
    title: "Performance monitoring across patient-language subgroups"
    status: rejected
    statement: >-
      Hypothesis rejected for the DoH standard: it requires bias detection and continuous monitoring for
      performance degradation, which covers the Arabic-language drift at T1. It does not name language as a
      subgroup; that is a guidance question, not a gap in the rule.
    uae_evidence:
      - clause_id: AE-DOH-RAI-2025/sec-3.1.5.1.3/en
        quote: "Bias detection techniques must be implemented, and mitigation efforts must be traceable."
      - clause_id: AE-DOH-RAI-2025/sec-3.1.2.1.4/en
        quote: "Post deployment systems must be monitored continuously for performance degradation, anomalies, and unintended consequences, with automated alerts and manual review triggers."
    global_example: null
    readiness_dimensions: [11, 6]
    implication: "The UAE standard already supports the control the scenario needed."
    next_step: "Optional guidance: list patient language among the subgroups monitored for bias in Abu Dhabi."

  - id: TV4
    candidate: CG-T4
    type: policy
    pattern: G1_POLICY_VOID
    title: "No duty to tell patients about an AI triage error below the sentinel-event level"
    status: verified
    scope_note: "Sentinel events are covered: DHA's sentinel-event standard (outside our KB, checked by hand) asks facilities to involve patients and families so the case is openly disclosed (5.12, 'should'). The gap is AI errors below that level."
    statement: >-
      For sentinel events, Dubai asks facilities to "strongly involve patients and their families" so the case
      is "openly disclosed" (DHA/HRS/CACD/ST-01 v1.1, 5.12, a "should"). Below that level, the DoH standard
      requires telling patients when AI contributes to decisions (disclosure of use), not informing patients
      affected by an AI error. The medical liability law requires a physician to keep the patient informed of
      their condition, which does not reach an AI triage error made before any physician saw the patient.
      Security-incident communication plans (ADHICS IM 2.1) and data-breach notices (PDPL Art. 9) do not cover a
      clinical error. No instrument we checked requires informing patients mis-triaged by an AI when the error
      is caught before it becomes a sentinel event.
    external_evidence:
      - source: "DHA Standards for Sentinel Events Notification and Management in Health Facilities, DHA/HRS/CACD/ST-01, v1.1, effective 06/05/2025"
        url: "https://www.dha.gov.ae/uploads/042025/Sentinel%20Events%20Notification%20And%20Management%20In%20Health%20Facilities-Final202541624.pdf"
        section: "5.12"
        quote: "Health facilities should strongly involve patients and their families in any sentinel event cases."
        checked: "by hand, 2026-11-10 (not in the KB, so not checked by scripts/check_gaps_verified.py)"
    uae_evidence:
      - clause_id: AE-DOH-RAI-2025/sec-3.1.6.1.1/en
        quote: "All healthcare AI systems must include mechanisms to inform patients, clinicians, and relevant stakeholders when AI contributes to clinical or operational decisions"
      - clause_id: AE-DOH-ADHICS/sec-IM-2/en
        quote: "Plan for incident communication to affected stakeholders and relevant authorities"
      - clause_id: AE-FDL-4-2016/art-4/para-7/en
        quote: "Keep the patient informed of the nature of the medical condition and its level of seriousness"
    global_example:
      jurisdiction: EU
      instrument: "GDPR, Art. 34(1) (data breaches only)"
      clause_id: EU-REG-2016-679/art-34/para-1/en
      quote: "the controller shall communicate the personal data breach to the data subject without undue delay"
      how_it_handles: "Communication to affected individuals is mandatory for high-risk data breaches; the AI Act's Art. 86 adds a right to an explanation of AI-based decisions."
    readiness_dimensions: [6, 11]
    implication: "At T4 agents could not ground a decision to contact the misdiagnosed patient."
    next_step: "Propose an AI-error notification duty below the sentinel level (who informs the patient, by when) in the DoH Responsible AI Standard."
  - id: TV5
    candidate: SG1
    type: standards
    pattern: G5_STANDARDS
    title: "ITU-T Y.3172's Policy node does not cover policies from law, human approval or audit evidence"
    status: verified
    statement: >-
      Y.3172 takes policies from the network operator: the P node applies policies to model output, and ML
      output "may be controlled by network operator policies". It does not address policies derived from
      external law, how legal applicability is decided, how human approval is recorded, or what evidence is
      kept. MAJLIS proposes LA, HA, AE and GM as an extension.
    uae_evidence: []
    standard_evidence:
      - clause_id: ITU-T-Y3172/sec-8.1-part1/en
        quote: "P (policy): This node enables the application of policies to the output of the model node."
      - clause_id: ITU-T-Y3172/sec-7.2-part1/en
        quote: "Such application of ML output may be controlled by network operator policies."
    global_example: null
    readiness_dimensions: [10, 7]
    implication: "Two Y.3172-aligned systems can both 'apply policy' while only one can show which law, who approved, and the evidence."
    next_step: "Contribution to ITU-T SG13: a governance extension (LA/HA/AE/GM) around the P node, with MAJLIS as the reference implementation."
  - id: TV6
    candidate: SG2
    type: standards
    pattern: G5_STANDARDS
    title: "ITU-T Y.3173 levels do not distinguish legally bounded decisions"
    status: verified
    statement: >-
      Y.3173 rates the decision dimension by who defines the rules (human vs system), not by their legal
      source or binding force.
    uae_evidence: []
    standard_evidence:
      - clause_id: ITU-T-Y3173/sec-s8-part1/en
        quote: "decisions and execution instructions provided by a human being have the highest authority"
    global_example: null
    readiness_dimensions: [10, 6]
    implication: "Governed and ungoverned MAJLIS runs differ in legal accountability but could receive the same intelligence level."
    next_step: "Propose a qualifier for Y.3173's decision dimension: 'rules traceable to a binding instrument'."

  - id: TV7
    candidate: TG1
    type: technical
    pattern: null
    title: "No machine-readable, clause-level official UAE legal corpus"
    status: verified
    statement: >-
      The official UAE legislation portals refused or broke automated retrieval (HTTP 403 and TLS errors), so
      11 instruments, including the PDPL, had to be downloaded by hand in a browser: the texts are published for
      people to read, and we found no official machine-access feed. None of the four Arabic texts (two federal
      laws, two national strategies) could be extracted cleanly (broken lam-alef joins, presentation forms,
      scrambled order: 144 Arabic units failed QA). Cabinet Resolution 32/2020's MOHAP copy is a scanned image,
      and the English Ministerial Resolution 51/2021 stores its text out of reading order (we re-read it in
      visual order). Evidence: kb/sources/access_log.csv, kb/clauses/extraction_failed.jsonl,
      kb/sources/MANUAL_DOWNLOADS.md.
    uae_evidence: []
    global_example:
      jurisdiction: EU
      instrument: "EU Publications Office Cellar API (practice, not a legal provision)"
      clause_id: null
      quote: null
      how_it_handles: "EU legislation is served as structured XHTML through an official machine-access API; this build ingested the AI Act, GDPR and NIS2 (1,309 clauses) that way."
    readiness_dimensions: [1, 4]
    implication: "Agents representing UAE institutions reason over an incomplete corpus; TDRA and Data Office found little binding UAE text."
    next_step: "Contribute the clause-level KB to the ITU AI for Good Lab; propose an official machine-readable feed (with Arabic text) for UAE legislation."
  - id: TV8
    candidate: TG2
    type: technical
    pattern: G5_STANDARDS
    title: "No standard schema for institution-to-institution AI-incident messages"
    status: verified
    statement: >-
      Y.3172 interface requirements cover moving data and models between ML functionalities, not coordination
      messages between governing institutions. We found no published schema in our KB for AI-incident messages
      between health, data and telecom authorities (the cyber security strategy mentions an information-sharing
      framework for threats and vulnerabilities, which is not in our KB).
    uae_evidence: []
    standard_evidence:
      - clause_id: ITU-T-Y3172/sec-7.3-part1/en
        quote: "an interface to transfer data for training or testing models among ML functionalities of multiple levels"
    global_example: null
    readiness_dimensions: [7, 3]
    implication: "Each agency in the exercise needs typed requests, assessments and decisions to coordinate; today these are ad hoc."
    next_step: "Publish MAJLIS's blackboard message types as a draft schema for the 2027 multi-country error exercise."
  - id: TV9
    candidate: CG6
    type: policy
    pattern: G3_RESPONSIBILITY
    title: "Lead authority for a breach of AI-processed health data"
    status: rejected
    statement: >-
      Hypothesis rejected for Abu Dhabi: ADHICS names the recipient. Significant or severe incidents go to the
      health sector regulator of Abu Dhabi, and incidents and misuse of health information exchange are reported
      to the exchange operator and the regulator. The PDPL does not apply to health data that has its own
      legislation, so no competing Data Office duty arises for these records. What remains, the missing
      deadline, is part of TV2.
    uae_evidence:
      - clause_id: AE-DOH-ADHICS/sec-IM-2.2/en
        quote: "Ensure that significant/severe impact incidents are reported to the health sector regulator of Abu Dhabi"
      - clause_id: AE-DOH-ADHICS/sec-CM-4.3/en
        quote: "Report on incidents and misuse to the health information exchange operator and the health sector regulator of Abu Dhabi"
      - clause_id: AE-FDL-45-2021/art-2/en
        quote: "Personal Health Data that has legislation regulating its protection and processing"
    global_example: null
    readiness_dimensions: [7, 10]
    implication: >-
      In every run the agents still claimed overlapping notification duties (G3). The texts give the health
      regulator the lead in Abu Dhabi, so this is an awareness and exercise-design finding, not a gap in the rules.
    next_step: "Brief agencies (and the agent mandates) that ADHICS IM 2.2 routes significant health-data incidents to DoH."